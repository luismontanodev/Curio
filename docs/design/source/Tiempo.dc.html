<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Línea de tiempo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#C9B6F8}a:hover{color:#E2D6FC}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 16px; background: {{t.bg}}; color: {{t.text}}">

<div role="progressbar" aria-label="Progreso del capítulo" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.primary}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.track}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.track}}"></span>
<span style="height: 4px; border-radius: 2px; background: {{t.track}}"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 34px 4px 0">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: {{t.primaryText}}">HISTORIA · LÍNEA DE TIEMPO</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.15; font-weight: 700">Cleopatra vivió más cerca del iPhone que de la Gran Pirámide.</h1>
</div>

<figure role="img" aria-label="Línea de tiempo: Gran Pirámide hacia 2560 a. C., Cleopatra en 30 a. C., iPhone en 2007" style="margin: 24px 16px 0; position: relative; height: 200px">
<span style="position: absolute; left: 3px; top: 34px; width: 177px; height: 2px; background: {{t.muted}}"></span>
<span style="position: absolute; left: 3px; top: 28px; width: 2px; height: 14px; background: {{t.muted}}"></span>
<span style="position: absolute; left: 178px; top: 28px; width: 2px; height: 14px; background: {{t.muted}}"></span>
<span style="position: absolute; left: 30px; top: 8px; font-size: 13px; color: {{t.muted}}">≈ 2 530 años</span>

<span style="position: absolute; left: 182px; top: 64px; width: 141px; height: 2px; background: {{t.primary}}"></span>
<span style="position: absolute; left: 182px; top: 58px; width: 2px; height: 14px; background: {{t.primary}}"></span>
<span style="position: absolute; left: 321px; top: 58px; width: 2px; height: 14px; background: {{t.primary}}"></span>
<span style="position: absolute; left: 204px; top: 38px; font-size: 13px; font-weight: 600; color: {{t.primaryText}}">≈ 2 037 años</span>

<span style="position: absolute; left: 0; top: 110px; width: 326px; height: 2px; background: {{t.border}}"></span>
<span style="position: absolute; left: -4px; top: 104px; width: 14px; height: 14px; border-radius: 7px; background: {{t.muted}}"></span>
<span style="position: absolute; left: 173px; top: 104px; width: 14px; height: 14px; border-radius: 7px; background: {{t.text}}"></span>
<span style="position: absolute; left: 316px; top: 104px; width: 14px; height: 14px; border-radius: 7px; background: {{t.primary}}"></span>

<span style="position: absolute; left: -4px; top: 132px; width: 110px; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px; font-weight: 600">Gran Pirámide</strong><span style="font-size: 12px; color: {{t.muted}}">c. 2560 a. C.</span></span>
<span style="position: absolute; left: 130px; top: 132px; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 2px"><strong style="font-size: 14px; font-weight: 600">Cleopatra</strong><span style="font-size: 12px; color: {{t.muted}}">murió en 30 a. C.</span></span>
<span style="position: absolute; right: -4px; top: 132px; width: 80px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><strong style="font-size: 14px; font-weight: 600">iPhone</strong><span style="font-size: 12px; color: {{t.muted}}">2007</span></span>
</figure>

<p style="margin: 0; padding: 16px; border-radius: 16px; background: {{t.soft}}; font-size: 15px; line-height: 1.5">Para Cleopatra, las pirámides ya eran ruinas antiguas: estaban más lejos de ella en el tiempo que ella de nosotros.</p>

<div style="margin-top: auto; display: flex; align-items: center; gap: 4px">
<button aria-label="Guardar" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
<button aria-label="Enviar a alguien" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg></button>
<button style="margin-left: auto; height: 44px; padding: 0 18px; border: none; border-radius: 22px; background: {{t.soft}}; color: {{t.primaryText}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>Profundizar</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var dark = this.props.dark ?? true;
var light = { bg: '#FFFFFF', card: '#FFFFFF', soft: '#F3EDFC', border: '#E6DCF7', track: '#D9CFEA', text: '#1F1633', muted: '#5F5675', primary: '#7B5CC6', primaryText: '#6B4FB8', onPrimary: '#FFFFFF' };
var night = { bg: '#14101E', card: '#1E182D', soft: '#2A2140', border: '#352B4F', track: '#463B60', text: '#F3EEFC', muted: '#B5AACB', primary: '#C3AEF6', primaryText: '#C9B6F8', onPrimary: '#1F1633' };
return { t: dark ? night : light };
}
}
</script>
</body>
</html>
