<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paleta y tipografía</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#6B4FB8}a:hover{color:#4E3591}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">

<section style="background: #FFFFFF; color: #1F1633; padding: 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #6B4FB8">TEMA CLARO</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Lila y blanco</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{light}}" as="c" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #E6DCF7; background: {{c.hex}}; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">{{c.name}}</span><span style="font-size: 12px; color: #5F5675; font-family: ui-monospace, monospace">{{c.hex}}</span></div>
</div>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Space Grotesk · títulos</span>
<span style="font-size: 15px; color: #5F5675">Inter · texto y etiquetas</span>
</div>
</section>

<section style="background: #14101E; color: #F3EEFC; padding: 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #C9B6F8">TEMA OSCURO</span>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Morado noche</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{dark}}" as="c" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #352B4F; background: {{c.hex}}; flex-shrink: 0"></span>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">{{c.name}}</span><span style="font-size: 12px; color: #B5AACB; font-family: ui-monospace, monospace">{{c.hex}}</span></div>
</div>
</sc-for>
</div>
<p style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: #B5AACB">Fondo morado muy oscuro en lugar de negro puro: cansa menos la vista en lecturas largas.</p>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {
light: [
{ name: 'Fondo', hex: '#FFFFFF' }, { name: 'Lila suave', hex: '#F3EDFC' },
{ name: 'Borde', hex: '#E6DCF7' }, { name: 'Primario', hex: '#7B5CC6' },
{ name: 'Texto acento', hex: '#6B4FB8' }, { name: 'Texto', hex: '#1F1633' },
{ name: 'Texto secundario', hex: '#5F5675' }, { name: 'Switch apagado', hex: '#D9CFEA' }
],
dark: [
{ name: 'Fondo', hex: '#14101E' }, { name: 'Tarjeta', hex: '#1E182D' },
{ name: 'Lila suave', hex: '#2A2140' }, { name: 'Borde', hex: '#352B4F' },
{ name: 'Primario', hex: '#C3AEF6' }, { name: 'Texto acento', hex: '#C9B6F8' },
{ name: 'Texto', hex: '#F3EEFC' }, { name: 'Texto secundario', hex: '#B5AACB' }
]
};
}
}
</script>
</body>
</html>
