<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Microjuego</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#6B4FB8}a:hover{color:#4E3591}
button{font-family:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; color: #1F1633">

<div role="progressbar" aria-label="Progreso del capítulo" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<span style="height: 4px; border-radius: 2px; background: #7B5CC6"></span>
<span style="height: 4px; border-radius: 2px; background: #7B5CC6"></span>
<span style="height: 4px; border-radius: 2px; background: #7B5CC6"></span>
<span style="height: 4px; border-radius: 2px; background: #7B5CC6"></span>
<span style="height: 4px; border-radius: 2px; background: #7B5CC6"></span>
<span style="height: 4px; border-radius: 2px; background: #D9CFEA"></span>
<span style="height: 4px; border-radius: 2px; background: #D9CFEA"></span>
<span style="height: 4px; border-radius: 2px; background: #D9CFEA"></span>
<span style="height: 4px; border-radius: 2px; background: #D9CFEA"></span>
<span style="height: 4px; border-radius: 2px; background: #D9CFEA"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 18px 4px 0">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6B4FB8">MICROJUEGO · HISTORIA</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.15; font-weight: 700">¿Qué existió primero?</h1>
</div>

<button aria-pressed="true" style="position: relative; height: 172px; border-radius: 20px; border: 2px solid #7B5CC6; background: #F3EDFC; color: #1F1633; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 4px; text-align: left">
<span style="position: absolute; top: 14px; right: 14px; padding: 5px 10px; border-radius: 12px; background: #7B5CC6; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Primero</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">La Universidad de Oxford</span>
<span style="font-size: 14px; color: #5F5675">Ya se enseñaba ahí hacia 1096</span>
</button>

<button aria-pressed="false" style="height: 172px; border-radius: 20px; border: 1px solid #E6DCF7; background: #FFFFFF; color: #1F1633; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 4px; text-align: left">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">La ciudad de Tenochtitlan</span>
<span style="font-size: 14px; color: #5F5675">Fundada en 1325</span>
</button>

<p style="margin: 0; padding: 16px; border-radius: 16px; background: #F3EDFC; font-size: 15px; line-height: 1.5">Oxford es más de dos siglos más antigua que la capital mexica. Las dos coincidieron en el tiempo: cuando llegaron los españoles, Oxford llevaba más de 400 años enseñando.</p>

<span style="margin-top: auto; align-self: center; font-size: 12px; color: #5F5675">Desliza hacia arriba para el siguiente momento</span>
</div>


</body>
</html>
